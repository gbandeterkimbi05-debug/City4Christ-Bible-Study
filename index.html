<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City4Christ • NT Study Plan</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#5b2d7c" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #5b2d7c;
      --card: #482163;
      --card-hover: #542774;
      --text: #f8fafc;
      --muted: #e2d9eb;
      --accent: #f3c65d;
      --done: #34d399;
      --border: #753c9e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      margin: 0; padding: 16px 20px 80px; max-width: 680px; margin-inline: auto;
    }
    header {
      position: sticky; top: 0; background: rgba(91, 45, 124, 0.95);
      backdrop-filter: blur(8px); padding: 12px 0 14px; z-index: 10;
      border-bottom: 1px solid var(--border); margin-bottom: 18px;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .brand-container { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); }
    .brand-titles h1 { margin: 0; font-size: 1.2rem; color: var(--text); }
    .brand-titles span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; display: block; }
    
    .header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-action, .btn-auth {
      background: #482163; color: var(--accent); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .btn-action:hover, .btn-auth:hover { background: #542774; }
    
    .progress-bar { background: #37174e; height: 10px; border-radius: 99px; overflow: hidden; }
    .progress-fill { background: var(--done); height: 100%; width: 0%; transition: width 0.3s ease; }
    .stats { font-size: 0.85rem; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; }
    
    .filters { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
    .filter-btn {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 5px 11px; border-radius: 99px; font-size: 0.78rem; cursor: pointer; white-space: nowrap;
    }
    .filter-btn.active { background: var(--accent); color: #37174e; font-weight: 700; border-color: var(--accent); }
    
    .day-card {
      background: var(--card); border-radius: 12px; padding: 16px;
      margin-bottom: 14px; border-left: 4px solid var(--accent);
      transition: opacity 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .day-card.completed { border-left-color: var(--done); opacity: 0.85; }
    .day-card.locked { opacity: 0.5; border-left-color: #6b5b7a; }
    
    .day-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .phase-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); display: block; margin-bottom: 2px; font-weight: 600; }
    .day-title { font-weight: 700; font-size: 1.05rem; }
