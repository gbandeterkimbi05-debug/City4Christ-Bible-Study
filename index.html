<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City4Christ • NT Study Plan</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#5b2d7c" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #5b2d7c;
      --card: #482163;
      --card-hover: #542774;
      --text: #f8fafc;
      --muted: #e2d9eb;
      --accent: #f3c65d;
      --done: #34d399;
      --border: #753c9e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      margin: 0; padding: 16px 20px 60px; max-width: 680px; margin-inline: auto;
    }
    header {
      position: sticky; top: 0; background: rgba(91, 45, 124, 0.95);
      backdrop-filter: blur(8px); padding: 12px 0 14px; z-index: 10;
      border-bottom: 1px solid var(--border); margin-bottom: 18px;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .brand-container { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); }
    .brand-titles h1 { margin: 0; font-size: 1.2rem; color: var(--text); }
    .brand-titles span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; display: block; }
    
    .header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-action, .btn-auth {
      background: #482163; color: var(--accent); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .btn-action:hover, .btn-auth:hover { background: #542774; }
    
    .progress-bar { background: #37174e; height: 10px; border-radius: 99px; overflow: hidden; }
    .progress-fill { background: var(--done); height: 100%; width: 0%; transition: width 0.3s ease; }
    .stats { font-size: 0.85rem; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; }
    
    .filters { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
    .filter-btn {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 5px 11px; border-radius: 99px; font-size: 0.78rem; cursor: pointer; white-space: nowrap;
    }
    .filter-btn.active { background: var(--accent); color: #37174e; font-weight: 700; border-color: var(--accent); }
    
    .day-card {
      background: var(--card); border-radius: 12px; padding: 16px;
      margin-bottom: 14px; border-left: 4px solid var(--accent);
      transition: opacity 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .day-card.completed { border-left-color: var(--done); opacity: 0.75; }
    .day-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .phase-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); display: block; margin-bottom: 2px; font-weight: 600; }
    .day-title { font-weight: 700; font-size: 1.05rem; }
    
    .passage-link {
      display: inline-block; color: var(--accent); font-size: 0.9rem; margin: 8px 0;
      font-weight: 500; text-decoration: none; background: rgba(243, 198, 93, 0.1);
      padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(243, 198, 93, 0.25);
    }
    .passage-link:hover { background: rgba(243, 198, 93, 0.2); }
    
    .focus { color: var(--muted); font-size: 0.86rem; line-height: 1.4; margin-bottom: 12px; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--done); cursor: pointer; flex-shrink: 0; margin-top: 4px; }
    
    textarea {
      width: 100%; box-sizing: border-box; background: #37174e; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem;
      resize: vertical; min-height: 44px; font-family: inherit;
    }
    textarea:focus { outline: none; border-color: var(--accent); }

    #auth-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .auth-card {
      background: #482163; border: 1px solid var(--border); padding: 2rem;
      border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); text-align: center;
    }
    .auth-card h2 { color: var(--accent); margin-top: 0; }
    .auth-card input {
      width: 100%; padding: 0.75rem; margin: 0.5rem 0; background: #37174e;
      border: 1px solid var(--border); border-radius: 8px; color: var(--text); box-sizing: border-box;
    }
    .auth-card input:focus { outline: none; border-color: var(--accent); }
    .auth-card button.submit-auth {
      width: 100%; background-color: var(--accent); color: #37174e; border: none;
      padding: 0.75rem; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem;
    }
    .auth-card button.submit-auth:hover { opacity: 0.9; }
    .toggle-auth, .forgot-password { margin-top: 0.75rem; font-size: 0.85rem; color: var(--muted); cursor: pointer; text-decoration: underline; display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="auth-modal" class="hidden">
    <div class="auth-card">
      <h2 id="auth-title">Welcome to City4Christ</h2>
      <p id="auth-subtitle" style="font-size: 0.9rem; color: var(--muted);">Sign in to securely sync your study notes and progress.</p>
      
      <input type="email" id="email" placeholder="Email address">
      <input type="password" id="password" placeholder="Password">
      
      <button class="submit-auth" id="auth-submit-btn" onclick="handleAuth()">Sign In</button>
      <span class="forgot-password" onclick="handleForgotPassword()">Forgot password?</span>
      <div class="toggle-auth" onclick="toggleAuthMode()">Need an account? Sign Up</div>
      <div id="auth-error" style="color: #ff6b6b; font-size: 0.85rem; margin-top: 0.75rem;"></div>
    </div>
  </div>

  <header>
    <div class="top-row">
      <div class="brand-container">
        <img src="icon.png" alt="City4Christ Logo" class="brand-logo" />
        <div class="brand-titles">
          <span>The House of Good News</span>
          <h1>City4Christ Bible Study</h1>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-action" id="shareBtn">Share Progress</button>
        <button class="btn-action" id="exportBtn">Export Notes</button>
        <button class="btn-auth hidden" id="logoutBtn" onclick="logoutUser()">Log Out</button>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats">
      <span id="progressText">0 of 30 Days Completed</span>
      <span id="percentText">0%</span>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All Days (30)</button>
      <button class="filter-btn" data-filter="1">Phase 1: Gospels</button>
      <button class="filter-btn" data-filter="2">Phase 2: Acts & Paul</button>
      <button class="filter-btn" data-filter="3">Phase 3: Final Letters</button>
    </div>
  </header>

  <main id="planContainer"></main>

  <script>
    const SUPABASE_URL = 'https://wwjmkaimrwkfhwettsdq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_B-Pf2Jj0V2izHi95z_Qj-Q_rzbSZfT8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;
    let currentUser = null;
    let savedState = { completed: {}, notes: {} };
    let currentFilter = "all";

    async function checkUserSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUser = session?.user || null;
      
      if (!currentUser) {
        document.getElementById('auth-modal').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
      } else {
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        await fetchUserData();
      }
    }

    async function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('auth-error');
      errorEl.textContent = '';

      if (isSignUp) {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
          errorEl.textContent = error.message;
        } else {
          alert('Account created successfully! You can now sign in.');
          isSignUp = false;
          toggleAuthMode();
        }
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          errorEl.textContent = error.message;
        } else {
          checkUserSession();
        }
      }
    }

    async function handleForgotPassword() {
      const email = document.getElementById('email').value;
      const errorEl = document.getElementById('auth-error');
      errorEl.textContent = '';

      if (!email) {
        errorEl.textContent = 'Please enter your email address above first.';
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href,
      });

      if (error) {
        errorEl.textContent = error.message;
      } else {
        alert('Password reset link sent! Check your email inbox.');
      }
    }

    async function logoutUser() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('auth-title').textContent = isSignUp ? 'Create Account' : 'Welcome to City4Christ';
      document.getElementById('auth-submit-btn').textContent = isSignUp ? 'Sign Up' : 'Sign In';
      document.querySelector('.toggle-auth').textContent = isSignUp ? 'Already have an account? Sign In' : 'Need an account? Sign Up';
    }

    async function fetchUserData() {
      if (!currentUser) return;
      const { data, error } = await supabaseClient
        .from('user_notes')
        .select('day_number, note_content, completed')
        .eq('user_id', currentUser.id);

      if (data && !error) {
        savedState = { completed: {}, notes: {} };
        data.forEach(row => {
          if (row.note_content) savedState.notes[row.day_number] = row.note_content;
          if (row.completed) savedState.completed[row.day_number] = row.completed;
        });
      }
      renderPlan();
    }

    async function saveDayData(dayNumber) {
      if (!currentUser) return;
      const content = savedState.notes[dayNumber] || "";
      const isDone = !!savedState.completed[dayNumber];

      await supabaseClient
        .from('user_notes')
        .upsert({ 
          user_id: currentUser.id, 
          day_number: dayNumber, 
          note_content: content,
          completed: isDone,
          updated_at: new Date()
        }, { onConflict: 'user_id,day_number' });

      updateProgress();
    }

    const studyPlan = [
      { day: 1, phase: 1, phaseName: "Phase 1 • Gospels", title: "Pre-Existence & Birth", passages: "John 1:1-18; Luke 1; Matthew 1:18-25; Luke 2; Matthew 2", focus: "Compare John's cosmic opening with Luke's historical detail and Matthew's Old Testament fulfillment." },
      { day: 2, phase: 1, phaseName: "Phase 1 • Gospels", title: "Preparation & Early Ministry", passages: "Matthew 3-4; Mark 1; Luke 3-4; John 1:19-51; John 2-4", focus: "Baptism, temptation in the wilderness, calling the first disciples, and early signs in Cana and Samaria." },
      { day: 3, phase: 1, phaseName: "Phase 1 • Gospels", title: "The Sermon on the Mount", passages: "Matthew 5-7; Luke 6:17-49", focus: "Kingdom ethics: compare Matthew's mountain sermon with Luke's sermon on the plain." },
      { day: 4, phase: 1, phaseName: "Phase 1 • Gospels", title: "Authority Over Disease & Nature", passages: "Matthew 8-9; Mark 2-5; Luke 5; Luke 7-8", focus: "Notice how Mark emphasizes fast-paced action and immediate authority over storms, demons, and sickness." },
      { day: 5, phase: 1, phaseName: "Phase 1 • Gospels", title: "Sending the Twelve & Parables", passages: "Matthew 10-13; Mark 3:13-35; Mark 4:1-34; Mark 6:1-13; Luke 9:1-6", focus: "Jesus commissions the disciples and uses parables to reveal the mysteries of the Kingdom." },
      { day: 6, phase: 1, phaseName: "Phase 1 • Gospels", title: "Miracles & Bread of Life", passages: "Matthew 14-15; Mark 6:30-56; Mark 7; Luke 9:10-17; John 5-6", focus: "Feeding the 5,000 across all four Gospels, followed by John's theological discourse on Jesus as the Bread of Life." },
      { day: 7, phase: 1, phaseName: "Phase 1 • Gospels", title: "Peter’s Confession & Transfiguration", passages: "Matthew 16-18; Mark 8-9; Luke 9:18-62", focus: "The turning point of the Gospels: Peter recognizes Jesus as the Christ, and Jesus begins predicting His death." },
      { day: 8, phase: 1, phaseName: "Phase 1 • Gospels", title: "Ministry in Judea & Conflict", passages: "John 7-10; Luke 10-13", focus: "Rising tension with religious leaders at the Feast of Tabernacles and Luke's parables (Good Samaritan)." },
      { day: 9, phase: 1, phaseName: "Phase 1 • Gospels", title: "Parables of Grace & Lazarus", passages: "Luke 14-17; John 11", focus: "Lost sheep, lost coin, prodigal son, and Jesus demonstrating power over death by raising Lazarus." },
      { day: 10, phase: 1, phaseName: "Phase 1 • Gospels", title: "Journey to Jerusalem", passages: "Matthew 19-20; Mark 10; Luke 18:1-19:27; John 12:1-11", focus: "Teachings on marriage, wealth, Zacchaeus, and Mary anointing Jesus at Bethany." },
      { day: 11, phase: 1, phaseName: "Phase 1 • Gospels", title: "Triumphal Entry & Temple Debates", passages: "Matthew 21-23; Mark
